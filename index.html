<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Fully self-contained: no external requests, no remote code, nothing leaves the page. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Snippet Tiles</title>
<style>
  :root {
    --bg:#f5f4ff; --m1:rgba(139,92,246,.20); --m2:rgba(236,72,153,.16); --m3:rgba(14,165,233,.18);
    --text:#17162b; --muted:#6b6a85; --panel:rgba(255,255,255,.78); --border:rgba(23,22,43,.10); --head:rgba(245,244,255,.86);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme=light]) {
    --bg:#0c0d18; --m1:rgba(139,92,246,.28); --m2:rgba(236,72,153,.18); --m3:rgba(14,165,233,.20);
    --text:#eeeefe; --muted:#9a99b8; --panel:rgba(30,31,52,.78); --border:rgba(255,255,255,.10); --head:rgba(12,13,24,.86);
  } }
  :root[data-theme=dark] {
    --bg:#0c0d18; --m1:rgba(139,92,246,.28); --m2:rgba(236,72,153,.18); --m3:rgba(14,165,233,.20);
    --text:#eeeefe; --muted:#9a99b8; --panel:rgba(30,31,52,.78); --border:rgba(255,255,255,.10); --head:rgba(12,13,24,.86);
  }
  * { box-sizing:border-box }
  html { background:var(--bg) }
  body { margin:0; min-height:100vh; color:var(--text); font:15px/1.45 ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif; }
  /* fixed layer instead of background-attachment:fixed, so scrolling never repaints the gradient */
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(900px 600px at 0% 0%, var(--m1), transparent 60%),
      radial-gradient(800px 600px at 100% 10%, var(--m2), transparent 60%),
      radial-gradient(900px 700px at 50% 110%, var(--m3), transparent 60%); }

  header { position:sticky; top:0; z-index:5; background:var(--head); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--border); }
  .bar { max-width:1240px; margin:0 auto; padding:14px 16px 10px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .brand { display:flex; align-items:center; gap:10px; margin-right:6px; }
  .logo { width:36px; height:36px; border-radius:11px; display:grid; place-items:center; font-size:18px; background:linear-gradient(135deg,#8b5cf6,#ec4899 55%,#f59e0b); box-shadow:0 6px 16px -6px #ec4899; }
  .brand h1 { font-size:18px; font-weight:800; margin:0; letter-spacing:-.01em; white-space:nowrap }
  .brand small { display:block; color:var(--muted); font-size:12px; font-weight:600 }
  .search { flex:1; min-width:180px; position:relative }
  .search input { width:100%; padding:10px 14px 10px 36px; border-radius:12px; border:1px solid var(--border); background:var(--panel); color:var(--text); font:inherit; }
  .search input:focus { outline:2px solid #8b5cf6; outline-offset:1px }
  .search::before { content:"⌕"; position:absolute; left:12px; top:50%; transform:translateY(-52%); color:var(--muted); font-size:18px }
  .seg { display:flex; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:3px; }
  .seg button { border:0; background:none; padding:6px 11px; border-radius:9px; color:var(--muted); cursor:pointer; font:inherit; font-size:13px; font-weight:600 }
  .seg button.on { background:var(--text); color:var(--bg) }
  .btn { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:8px 12px; cursor:pointer; font:inherit; font-size:13px; font-weight:600 }
  .btn:hover { border-color:#8b5cf6 }
  .chips { max-width:1240px; margin:0 auto; padding:0 16px 12px; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none }
  .chips:empty { display:none }
  .chip { display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:99px; border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer; white-space:nowrap; font:inherit; font-size:13px; font-weight:600 }
  .chip .dot { width:9px; height:9px; border-radius:50%; background:var(--g) }
  .chip.on { background:var(--g); color:#fff; border-color:transparent; box-shadow:0 6px 14px -8px var(--s) }
  .chip.on .dot { background:#fff }

  main { max-width:1240px; margin:0 auto; padding:6px 16px 80px }
  h2 { display:flex; align-items:center; gap:10px; font-size:14px; font-weight:800; letter-spacing:.02em; margin:26px 0 12px }
  h2 .dot { width:12px; height:12px; border-radius:4px; background:var(--g); box-shadow:0 2px 8px -2px var(--s) }
  h2 .n { color:var(--muted); font-weight:600; font-size:12px; background:var(--panel); border:1px solid var(--border); padding:1px 8px; border-radius:99px }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(205px,1fr)); gap:14px }

  .tile {
    position:relative; overflow:hidden; display:flex; flex-direction:column; gap:5px; text-align:left; contain:layout paint;
    min-height:112px; padding:15px 16px 13px; border:0; border-radius:18px; color:#fff; cursor:pointer; font:inherit;
    background:var(--g); box-shadow:0 12px 26px -14px var(--s), inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .tile::before { content:""; position:absolute; width:140px; height:140px; right:-50px; top:-60px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.32), transparent 70%); pointer-events:none }
  .tile:hover, .tile:focus-visible { transform:translateY(-3px); box-shadow:0 18px 32px -14px var(--s), inset 0 1px 0 rgba(255,255,255,.3) }
  .tile:focus-visible { outline:3px solid var(--text); outline-offset:2px }
  .tile:active { transform:scale(.97) }
  .ico { font-size:20px; line-height:1 }
  .k { font-weight:800; font-size:15.5px; line-height:1.25; padding-right:22px; text-shadow:0 1px 2px rgba(0,0,0,.12) }
  .v { font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .v.hid { letter-spacing:.2em }
  .tags { margin-top:auto; padding-top:4px; display:flex; gap:5px; flex-wrap:wrap }
  .tags i { font-style:normal; font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; background:rgba(255,255,255,.24) }
  .pin { position:absolute; top:9px; right:10px; font-size:16px; opacity:0; transition:opacity .15s; color:#fff }
  .tile:hover .pin, .tile:focus-visible .pin, .pin.on { opacity:.95 }
  .done { position:absolute; inset:0; display:grid; place-items:center; font-weight:800; font-size:16px; background:rgba(10,10,20,.45); opacity:0; transition:opacity .15s; pointer-events:none }
  .tile.copied .done { opacity:1 }

  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--text); color:var(--bg); padding:10px 18px; border-radius:99px; font-weight:600; opacity:0; pointer-events:none; transition:.2s; max-width:90vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; box-shadow:0 10px 30px -10px rgba(0,0,0,.5) }
  #toast.show { opacity:1; transform:translateX(-50%) }
  #empty { text-align:center; color:var(--muted); padding:70px 16px; display:none }
  #empty button { margin-top:14px; background:linear-gradient(135deg,#8b5cf6,#ec4899); color:#fff; border:0; border-radius:12px; padding:11px 18px; cursor:pointer; font:inherit; font-weight:700 }
  #drop { position:fixed; inset:0; background:rgba(139,92,246,.18); border:3px dashed #8b5cf6; display:none; align-items:center; justify-content:center; font-size:22px; font-weight:800; z-index:10 }
  .help { color:var(--muted); font-size:12px; text-align:center; margin-top:40px }
  kbd { font:11px ui-monospace,Menlo,monospace; padding:1px 5px; border:1px solid var(--border); border-radius:5px; background:var(--panel) }

  @media (max-width:640px) {
    .brand small { display:none }
    .search { order:5; flex-basis:100% }
    .grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px }
    .tile { min-height:100px; padding:13px }
    .help { display:none }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><div class="logo">📋</div><div><h1 id="title">Snippets</h1><small id="count"></small></div></div>
    <div class="search"><input id="q" type="search" placeholder="Search snippets…  ( / )" autocomplete="off" spellcheck="false"></div>
    <div class="seg" id="groupBy" title="Group tiles by">
      <button type="button" data-g="section">Sections</button><button type="button" data-g="tag">Tags</button><button type="button" data-g="none">All</button>
    </div>
    <button type="button" class="btn" id="open" title="Load a snippets.json from disk">Load JSON</button>
    <button type="button" class="btn" id="theme" title="Toggle light / dark">◐</button>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <div id="app"></div>
  <div id="empty">
    <p id="emptyMsg">No snippets found.</p>
    <button type="button" id="open2">Choose snippets.json</button>
  </div>
  <p class="help"><kbd>/</kbd> search · <kbd>↑↓←→</kbd> move · <kbd>Enter</kbd> copy · <kbd>P</kbd> pin · <kbd>Esc</kbd> clear</p>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="drop">Drop snippets.json here</div>
<input id="file" type="file" accept=".json,application/json" hidden>

<script>
/*
  snippets.json format
  --------------------
  "Tile name": "value to copy"                     a tile (an array of strings = multi-line value)
  "Tile name": { "value": "...",                    a tile with options:
                 "color": "red",                      palette name or any CSS colour
                 "icon": "🚨",                         emoji shown on the tile
                 "tags": ["prod"],                    tags for filtering / grouping
                 "hidden": true }                     hide the value on screen (also: start the name with 🔒)
  "Section name": { "_color": "..", "_icon": "..",  a section of tiles; _tags apply to every tile inside
                    "_tags": [..], "Tile": ... }
  "_config": { "title": "...",                     page title
               "groupBy": "section|tag|none",       default grouping
               "recent": 6,                         size of the "Recent" row (0 turns it off)
               "tags": { "prod": { "label": "Production", "color": "red", "icon": "🚨" } } }
  Placeholders in values: {date} {time} {datetime} {iso}
  Palette: violet pink orange amber green lime teal sky blue red indigo slate

  Privacy: the page only ever WRITES to the clipboard on your click; it never reads it, never
  contacts another host (enforced by the Content-Security-Policy above), and runs no remote code.
*/
'use strict';
const PALETTE = {
  violet:['#8b5cf6','#6366f1'], pink:['#ec4899','#e11d48'], orange:['#fb923c','#ef4444'], amber:['#f59e0b','#ea580c'],
  green:['#10b981','#047857'], lime:['#84cc16','#15803d'], teal:['#14b8a6','#0e7490'], sky:['#0ea5e9','#2563eb'],
  blue:['#3b82f6','#4338ca'], red:['#f43f5e','#b91c1c'], indigo:['#6366f1','#7e22ce'], slate:['#64748b','#1e293b'],
};
const CYCLE = ['violet','sky','pink','teal','orange','indigo','green','red','blue','amber','lime'];
const $ = s => document.querySelector(s);
const LS = { get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch{ return d } },
             set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch{} } };

let cfg = {}, sections = [], items = [], byId = new Map(), tagCache = new Map(), lastRaw = '';
let pins = new Set(LS.get('pins', []));
let recent = LS.get('recent', []);
let activeTags = new Set(LS.get('tags', []));
let groupBy = null, toastTimer, frame = 0;

const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
const hashColor = s => CYCLE[[...String(s)].reduce((a,c) => a + c.charCodeAt(0), 0) % CYCLE.length];
function paint(el, c) {
  const p = PALETTE[c];
  const a = p ? p[0] : c, b = p ? p[1] : `color-mix(in srgb, ${c} 62%, #000)`;
  el.style.setProperty('--g', `linear-gradient(135deg, ${a}, ${b})`);
  el.style.setProperty('--s', a);
  return el;
}
function tagInfo(t) {
  if (!tagCache.has(t)) {
    const c = cfg.tags?.[t], o = typeof c === 'string' ? { color:c } : (c || {});
    tagCache.set(t, { label:o.label || t, color:o.color || hashColor(t), icon:o.icon || '' });
  }
  return tagCache.get(t);
}

function parse(data) {
  if (!isObj(data)) throw new Error('top level must be an object');
  cfg = isObj(data._config) ? data._config : {};
  sections = []; items = []; byId = new Map(); tagCache = new Map();
  let n = 0;
  const add = (key, raw, sec) => {
    const o = isObj(raw) ? raw : { value:raw };
    const tags = [...new Set([...(sec?.tags || []), ...[].concat(o.tags || [])].map(String))];
    const it = {
      id:(sec?.name || '') + '\u0000' + key, key, section:sec?.name || '',
      value:Array.isArray(o.value) ? o.value.join('\n') : String(o.value ?? ''),
      color:o.color || sec?.color || CYCLE[n++ % CYCLE.length],
      icon:o.icon || '', tags, hidden:!!o.hidden || key.startsWith('🔒'),
    };
    // pre-computed lowercase text so each keystroke is a cheap string test
    it.hay = [key, it.section, ...tags.map(t => tagInfo(t).label), it.hidden ? '' : it.value].join('\n').toLowerCase();
    items.push(it); byId.set(it.id, it);
  };
  for (const [k,v] of Object.entries(data)) {
    if (k.startsWith('_')) continue;
    if (isObj(v) && !('value' in v)) {
      const sec = { name:k, color:v._color, icon:v._icon || '', tags:[].concat(v._tags || []) };
      sections.push(sec);
      for (const [k2,v2] of Object.entries(v)) if (!k2.startsWith('_')) add(k2, v2, sec);
    } else add(k, v, null);
  }
  const t = cfg.title || 'Snippets';
  $('#title').textContent = t; document.title = t;
  if (!groupBy) groupBy = LS.get('groupBy', null) || cfg.groupBy || 'section';
}

function allTags() {
  const used = new Set(items.flatMap(i => i.tags));
  const known = Object.keys(cfg.tags || {}).filter(t => used.has(t));
  return [...known, ...[...used].filter(t => !known.includes(t)).sort()];
}

function expand(text) {
  const d = new Date(), p = n => String(n).padStart(2,'0');
  const date = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  const time = `${p(d.getHours())}:${p(d.getMinutes())}`;
  return text.replace(/\{(date|time|datetime|iso)\}/g, (_,t) =>
    t==='date' ? date : t==='time' ? time : t==='datetime' ? `${date} ${time}` : d.toISOString());
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0';
  const prev = document.activeElement;
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch {}
  ta.remove(); prev?.focus?.(); return ok;
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

async function copyTile(btn) {
  const item = byId.get(btn.dataset.id);
  if (!item) return;
  const ok = await copy(expand(item.value));
  toast(ok ? `Copied “${item.key.replace(/^🔒\s*/,'')}”` : 'Copy failed — browser blocked the clipboard');
  if (!ok) return;
  btn.classList.add('copied'); setTimeout(() => btn.classList.remove('copied'), 800);
  recent = [item.id, ...recent.filter(id => id !== item.id)].slice(0, 20);
  LS.set('recent', recent);
}

function togglePin(id) {
  pins.has(id) ? pins.delete(id) : pins.add(id);
  LS.set('pins', [...pins]); render(id);
}

function renderChips() {
  const box = $('#chips'), frag = document.createDocumentFragment();
  const tags = allTags();
  const chip = (label, color, on, fn) => {
    const c = paint(document.createElement('button'), color);
    c.className = 'chip' + (on ? ' on' : ''); c.type = 'button';
    c.innerHTML = '<span class="dot"></span>'; c.append(label); c.onclick = fn;
    frag.appendChild(c);
  };
  if (tags.length) {
    chip('All', 'violet', !activeTags.size, () => { activeTags.clear(); LS.set('tags', []); render(); });
    for (const t of tags) {
      const info = tagInfo(t);
      chip(`${info.icon ? info.icon + ' ' : ''}${info.label}`, info.color, activeTags.has(t), () => {
        activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t);
        LS.set('tags', [...activeTags]); render();
      });
    }
  }
  box.replaceChildren(frag);
}

function tile(item) {
  const btn = paint(document.createElement('button'), item.color);
  btn.className = 'tile'; btn.type = 'button'; btn.dataset.id = item.id;
  if (!item.hidden) btn.title = item.value.length > 400 ? item.value.slice(0, 400) + '…' : item.value;
  const el = (cls, text) => { const s = document.createElement('span'); s.className = cls; s.textContent = text; btn.appendChild(s); return s; };
  if (item.icon) el('ico', item.icon);
  el('k', item.key);
  el(item.hidden ? 'v hid' : 'v', item.hidden ? '••••••••' : item.value.slice(0, 160).replace(/\s+/g,' '));
  if (item.tags.length) {
    const tg = el('tags', '');
    for (const t of item.tags) { const i = document.createElement('i'); i.textContent = tagInfo(t).label; tg.appendChild(i); }
  }
  const pinned = pins.has(item.id);
  el('pin' + (pinned ? ' on' : ''), pinned ? '★' : '☆').title = 'Pin to top (P)';
  el('done', '✓ Copied');
  return btn;
}

function render(focusId) {
  renderChips();
  for (const b of document.querySelectorAll('#groupBy button')) b.classList.toggle('on', b.dataset.g === groupBy);
  const words = $('#q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const visible = items.filter(i =>
    words.every(w => i.hay.includes(w)) &&
    (!activeTags.size || i.tags.some(t => activeTags.has(t))));
  const rest = visible.filter(i => !pins.has(i.id));
  const groups = [{ name:'Pinned', icon:'★', color:'amber', items:visible.filter(i => pins.has(i.id)) }];
  const nRecent = cfg.recent ?? 6;
  if (!words.length && nRecent > 0) {
    const vis = new Set(rest.map(i => i.id));
    groups.push({ name:'Recent', icon:'🕘', color:'slate', items:recent.filter(id => vis.has(id)).slice(0, nRecent).map(id => byId.get(id)) });
  }

  if (groupBy === 'section') {
    groups.push({ name:sections.length ? (cfg.ungroupedLabel || 'General') : '', icon:'', color:'slate', items:rest.filter(i => !i.section) });
    for (const s of sections) groups.push({ name:s.name, icon:s.icon, color:s.color || hashColor(s.name), items:rest.filter(i => i.section === s.name) });
  } else if (groupBy === 'tag') {
    for (const t of allTags()) {
      if (activeTags.size && !activeTags.has(t)) continue;
      const info = tagInfo(t);
      groups.push({ name:info.label, icon:info.icon, color:info.color, items:rest.filter(i => i.tags.includes(t)) });
    }
    groups.push({ name:'Untagged', icon:'', color:'slate', items:rest.filter(i => !i.tags.length) });
  } else {
    groups.push({ name:'', items:rest });
  }

  const frag = document.createDocumentFragment();
  const shown = groups.filter(g => g.items.length);
  for (const g of shown) {
    if (g.name) {
      const h = paint(document.createElement('h2'), g.color);
      h.innerHTML = '<span class="dot"></span>';
      h.append(`${g.icon ? g.icon + ' ' : ''}${g.name}`);
      const n = document.createElement('span'); n.className = 'n'; n.textContent = g.items.length; h.appendChild(n);
      frag.appendChild(h);
    }
    const grid = document.createElement('div'); grid.className = 'grid';
    for (const item of g.items) grid.appendChild(tile(item));
    frag.appendChild(grid);
  }
  $('#app').replaceChildren(frag);
  if (focusId) [...document.querySelectorAll('.tile')].find(t => t.dataset.id === focusId)?.focus({ preventScroll:true });
  $('#count').textContent = items.length ? `${items.length} snippets · click to copy` : '';
  $('#empty').style.display = shown.length ? 'none' : 'block';
  $('#emptyMsg').textContent = items.length ? 'No matches.' : 'Could not auto-load snippets.json (browsers block this on file:// pages). Choose or drop the file once — it is remembered on this browser.';
  $('#open2').style.display = items.length ? 'none' : '';
}

function load(raw, remember) {
  const data = JSON.parse(raw);
  parse(data); render();
  lastRaw = raw;
  if (remember) { try { localStorage.setItem('cache', raw); } catch {} }
}

async function loadFile(file) {
  try { load(await file.text(), true); toast(`Loaded ${file.name}`); }
  catch (e) { toast('Invalid JSON: ' + e.message); }
}

const served = /^https?:$/.test(location.protocol);
async function fetchSnippets(quiet) {
  if (!served) throw new Error('file');
  const r = await fetch('snippets.json', { cache:'no-store', credentials:'omit' });
  if (!r.ok) throw new Error(r.status);
  const raw = await r.text();
  if (raw !== lastRaw) { load(raw, true); if (quiet) toast('snippets.json updated'); }
}

async function init() {
  try { await fetchSnippets(false); }
  catch {
    let cached = null; try { cached = localStorage.getItem('cache'); } catch {}
    if (cached) { try { load(cached, false); if (served) toast('Offline — using last saved snippets'); } catch { render(); } }
    else render();
  }
}

// ---- events (delegated: one listener for every tile) ----
$('#app').addEventListener('click', e => {
  const btn = e.target.closest('.tile'); if (!btn) return;
  if (e.target.closest('.pin')) { e.stopPropagation(); togglePin(btn.dataset.id); return; }
  copyTile(btn);
});
$('#q').addEventListener('input', () => { cancelAnimationFrame(frame); frame = requestAnimationFrame(() => render()); });
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); const t = $('.tile'); if (t) copyTile(t); }
  if (e.key === 'ArrowDown') { e.preventDefault(); $('.tile')?.focus(); }
  if (e.key === 'Escape') { e.target.value = ''; render(); }
});

function moveFocus(cur, key) {
  const tiles = [...document.querySelectorAll('.tile')], i = tiles.indexOf(cur);
  if (key === 'ArrowRight') return tiles[i + 1];
  if (key === 'ArrowLeft') return tiles[i - 1] || $('#q');
  const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, down = key === 'ArrowDown';
  let best = null, bestRow = null, bestDx = Infinity;
  for (const t of tiles) {
    const b = t.getBoundingClientRect();
    if (down ? b.top <= r.top + 4 : b.top >= r.top - 4) continue;
    if (bestRow !== null && (down ? b.top > bestRow + 4 : b.top < bestRow - 4)) continue;
    const dx = Math.abs(b.left + b.width / 2 - cx);
    if (bestRow === null || Math.abs(b.top - bestRow) > 4 || dx < bestDx) { best = t; bestRow = b.top; bestDx = dx; }
  }
  return best || (down ? null : $('#q'));
}

document.addEventListener('keydown', e => {
  const inSearch = document.activeElement === $('#q');
  if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !inSearch)) { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  const cur = document.activeElement?.closest?.('.tile');
  if (!cur) return;
  if (e.key.startsWith('Arrow')) { e.preventDefault(); const n = moveFocus(cur, e.key); if (n) { n.focus(); n.scrollIntoView?.({ block:'nearest' }); } }
  else if (e.key === 'p' || e.key === 'P') togglePin(cur.dataset.id);
  else if (e.key === 'Escape') $('#q').focus();
});

for (const b of document.querySelectorAll('#groupBy button')) b.onclick = () => { groupBy = b.dataset.g; LS.set('groupBy', groupBy); render(); };
for (const id of ['#open','#open2']) $(id).onclick = () => $('#file').click();
$('#file').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value = ''; };
$('#theme').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; LS.set('theme', next);
};
const th = LS.get('theme', null); if (th) document.documentElement.dataset.theme = th;
// when served over http(s), pick up edits to snippets.json whenever you come back to the tab
document.addEventListener('visibilitychange', () => { if (!document.hidden && served) fetchSnippets(true).catch(() => {}); });
let dragN = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragN++; $('#drop').style.display = 'flex'; });
addEventListener('dragleave', () => { if (--dragN <= 0) $('#drop').style.display = 'none'; });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('#drop').style.display = 'none'; const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
init();
</script>
</body>
</html>
